workflows:
  android-build:
    name: Android Build
    max_build_duration: 60

    environment:
      java: 17

    scripts:
      - name: Build Debug APK
        script: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          echo "=== JAVA VERSION ==="
          java -version
          echo "=== GRADLE WRAPPER VERSION ==="
          ./gradlew --version
          echo "=== START BUILD ==="
          ./gradlew assembleDebug --stacktrace --info

    artifacts:
      - app/build/outputs/**/*.apk
